{% load static assets i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1B1440">
<script>
/* tema: oscuro por defecto y elegible; así los navegadores que oscurecen las páginas a la fuerza (p. ej. Samsung Internet) no cambian los colores */
(function(){var t='dark';try{t=localStorage.getItem('theme')||'dark';}catch(e){}
document.documentElement.dataset.theme=t;
window.toggleTheme=function(){var n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;try{localStorage.setItem('theme',n);}catch(e){}
var m=document.querySelector('meta[name=theme-color]');if(m)m.content=n==='light'?'#F2EEFF':'#1B1440';};})();
</script>
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}{% trans 'Escalas · práctica de piano' %}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&family=Noto+Music&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% asset_url 'escalas/css/app.css' %}">
{% jsi18n_script %}
{% js_importmap %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9D%84%9E%3C/text%3E%3C/svg%3E">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
</body>
</html>
