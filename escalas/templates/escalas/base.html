/* tema: oscuro por defecto y elegible; así los navegadores que oscurecen las páginas a la fuerza (p. ej. Samsung Internet) no cambian los colores */
(function(){var t='dark';try{t=localStorage.getItem('theme')||'dark';}catch(e){}
document.documentElement.dataset.theme=t;
window.toggleTheme=function(){var n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;(window.dataLayer=window.dataLayer||[]).push({event:'theme_change',theme:n});try{localStorage.setItem('theme',n);}catch(e){}
var m=document.querySelector('meta[name=theme-color]');if(m)m.content=n==='light'?'#F2EEFF':'#1B1440';};})();
</script>
